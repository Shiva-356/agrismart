server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: agrismart-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agrismart}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: AgriSmartHikariCP
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 2000
      # -1 bypasses initial connection failure on startup so the app can start
      # and serve /api/health even when local PostgreSQL is not running.
      initialization-fail-timeout: -1

  jpa:
    open-in-view: false
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        format_sql: false
        show_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

agrismart:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000,http://localhost:5173}
  ml:
    api-url: ${AGRISMART_ML_API_URL:http://localhost:8000}
    connect-timeout-seconds: ${AGRISMART_ML_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${AGRISMART_ML_READ_TIMEOUT_SECONDS:5}
  weather:
    provider: ${WEATHER_PROVIDER:open-meteo}
    base-url: ${WEATHER_API_BASE_URL:https://api.open-meteo.com}
    geocoding-base-url: ${WEATHER_GEOCODING_BASE_URL:https://geocoding-api.open-meteo.com}
    api-key: ${WEATHER_API_KEY:}
    connect-timeout-seconds: ${WEATHER_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${WEATHER_READ_TIMEOUT_SECONDS:5}
